<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>COF Mini-map Test</title>
  <style>
    body { background:#111; height:100vh; margin:0; }
    #miniMap { width: 360px !important; height: 360px !important; }

  </style>
</head>
<body>

<script src="cof_minimap.js"></script>

<script>
  // fake MIDI input
  const notes = [60, 67, 62, 69, 64, 71];
  let i = 0;
  setInterval(() => {
    const m = notes[i++ % notes.length];
    window.dispatchEvent(new CustomEvent("midi:noteon", {
      detail: { midi: m, velocity: 100, ts: performance.now() }
    }));
  }, 700);
</script>

</body>
</html>
