<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Music Theory Laboratory — Home</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 13px/1.45 system-ui, Segoe UI, Roboto, sans-serif; color: #0f172a;
           background: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
    #dashHeader { padding: 8px 12px; background: #0b3a53; color: #fff; }
    #dashHeader h1 { margin: 0; font-size: 15px; }
    #dashHeader .sub { font-size: 11.5px; opacity: .85; }
    #dashBody { flex: 1; overflow: auto; padding: 10px 12px; display: flex;
                flex-direction: column; gap: 10px; }
    .dashCard { border: 1px solid #e2e8f0; border-radius: 8px; background: #fff; padding: 8px 10px; }
    .dashSecTitle { font-size: 11px; font-weight: 700; text-transform: uppercase;
                    letter-spacing: .04em; color: #0b3a53; margin: 0 0 4px; display: flex;
                    justify-content: space-between; align-items: baseline; }
    .dashSecTitle .count { color: #b45309; font-weight: 600; text-transform: none; }

    /* header summary */
    .dashStreak { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
    .dashOverall { color: #334155; margin: 2px 0 4px; }
    .dashBar { height: 8px; border-radius: 4px; background: #e2e8f0; overflow: hidden; }
    .dashBar > span { display: block; height: 100%; background: #22c55e; }

    /* due-today strip */
    #dashDue { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0; }
    .dashDueCard { min-width: 170px; max-width: 220px; border: 1px solid #e2e8f0; border-left: 4px solid #d97706;
                   border-radius: 7px; padding: 6px 8px; cursor: pointer; background: #fff; flex: 0 0 auto; }
    .dashDueCard:hover { background: #f1f5f9; }
    .dashDueCard.dashState-completed { border-left-color: #16a34a; }
    .dashDueCard.dashState-mastered { border-left-color: #7c3aed; }
    .dashDueTitle { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dashDueMeta { font-size: 11px; color: #64748b; }
    .dashEmpty { color: #94a3b8; font-style: italic; padding: 4px 0; }

    /* journey chips */
    #dashJourney { display: flex; gap: 6px; flex-wrap: wrap; }
    .dashChip { padding: 2px 10px; border-radius: 999px; background: #ede9fe; border: 1px solid #ddd6fe;
                color: #5b21b6; font-size: 11.5px; }

    /* mastery heatmap — one cell per exercise leaf, curriculum state colors */
    .dashCat { margin: 6px 0; }
    .dashCatHead { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; }
    .dashCatLabel { font-weight: 600; color: #0b3a53; }
    .dashCatPct { font-size: 11px; color: #64748b; }
    .dashGrid { display: flex; flex-wrap: wrap; gap: 3px; }
    .dashCell { width: 14px; height: 14px; border-radius: 3px; background: #e2e8f0; cursor: pointer; }
    .dashCell:hover { outline: 2px solid #2563eb; outline-offset: -1px; }
    .dashCell.dashState-started { background: #d97706; }
    .dashCell.dashState-completed { background: #16a34a; }
    .dashCell.dashState-mastered { background: #7c3aed; }
    #dashLegend { margin-top: 6px; font-size: 11.5px; color: #64748b; }
  </style>
</head>
<body>
  <div id="dashHeader">
    <h1>Home — practice dashboard</h1>
    <div class="sub">Streak · due-today reviews · mastery heatmap across the whole curriculum. Click any cell or card to launch it.</div>
  </div>
  <div id="dashBody">
    <div id="dashPlaceholder" class="dashEmpty" style="display:none"></div>
    <div class="dashCard" id="dashSummary"></div>
    <div class="dashCard">
      <div class="dashSecTitle"><span>Due today</span><span class="count" id="dashDueCount"></span></div>
      <div id="dashDue"></div>
    </div>
    <div class="dashCard">
      <div class="dashSecTitle"><span>Functional journey</span></div>
      <div id="dashJourney"></div>
    </div>
    <div class="dashCard">
      <div class="dashSecTitle"><span>Mastery heatmap</span></div>
      <div id="dashHeatmap"></div>
      <div id="dashLegend"></div>
    </div>
  </div>

  <script src="dashboard.js"></script>
  <script>
    (function () {
      if (window.DASHBOARD_DATA && window.Dashboard) {
        window.Dashboard.init(window.DASHBOARD_DATA);
      } else {
        var b = document.getElementById("dashPlaceholder");
        if (b) {
          b.style.display = "block";
          b.textContent = "Waiting for dashboard data (launch via run_dashboard_demo.py or run_harmony_lab_demo.py).";
        }
      }
    })();
  </script>
</body>
</html>
