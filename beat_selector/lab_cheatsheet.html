<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lab — Cheatsheet</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font: 12px/1.45 system-ui, Segoe UI, Roboto, sans-serif; color: #0f172a;
           background: #f8fafc; }
    #csRoot { padding: 10px; }
    .csTitle { font-size: 14px; font-weight: 700; color: #0b3a53; }
    .csHint { color: #64748b; font-size: 11.5px; margin: 2px 0 8px; }
    .csBlock { margin: 10px 0; }
    .csBlock h4 { margin: 4px 0; font-size: 12px; color: #0b3a53; }
    table.csTable { border-collapse: collapse; font-size: 11.5px; }
    table.csTable th, table.csTable td { border: 1px solid #e2e8f0; padding: 3px 7px; text-align: left; }
    table.csTable th { background: #f1f5f9; color: #334155; }
    .csTable .rn { font-weight: 700; }
    .csTable tr.fn-T td { background: rgba(22,163,74,.06); }
    .csTable tr.fn-S td { background: rgba(217,119,6,.06); }
    .csTable tr.fn-D td { background: rgba(220,38,38,.06); }
    .csLayer { color: #334155; margin: 2px 0; }
    .csFn { margin: 2px 0; padding: 2px 8px; border-radius: 6px; display: inline-block; }
    .csFn.fn-T { background: rgba(22,163,74,.14); }
    .csFn.fn-S { background: rgba(217,119,6,.14); }
    .csFn.fn-D { background: rgba(220,38,38,.14); }
  </style>
</head>
<body>
  <div id="csRoot"></div>
  <script src="lab_cheatsheet.js"></script>
  <script>
    (function () {
      if (window.CHEATSHEET_DATA && window.LabCheatsheet) {
        window.LabCheatsheet.init(window.CHEATSHEET_DATA);
      } else {
        var r = document.getElementById("csRoot");
        if (r) r.textContent = "Waiting for cheatsheet data (launch via run_harmony_lab_demo.py).";
      }
    })();
  </script>
</body>
</html>
