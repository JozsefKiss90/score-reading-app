<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {
    --hl-fill: rgba(255, 214, 10, 0.18);
    --hl-stroke: rgba(255, 149, 0, 0.75);
    --cursor: #ff3b30;
    --beat-fill: rgba(255, 214, 10, 0.14);
    --beat-stroke: rgba(255, 149, 0, 0.9);
  }
  html, body {
    margin:0; padding:0; background:#fff; height:100%; color:#111;
  }
  #frame {
    position:relative;
    width:100%; height:100vh;
    overflow:hidden;
    background:#fff;
    display:flex;                /* score + sidebar */
  }
  #scorePane{
    position:relative;
    flex:1 1 auto;
    height:100%;
  }
  #side{
    width:260px;
    max-width:33vw;
    border-left:1px solid #e5e7eb;
    background:#fafafa;
    overflow:auto;
    font:13px/1.3 system-ui;
  }
  #side h3{
    margin:8px 8px 4px;
    font:600 13px system-ui;
    color:#0b3a53;
  }
  #beatList .beatEntry{
    margin:6px;
    padding:6px;
    border:1px solid #dbeafe;
    background:#eff6ff;
    border-radius:6px;
  }
  #beatList .beatTitle{
    font-weight:600;
    margin-bottom:4px;
  }
  #beatList .noteItem{
    margin:3px 0;
    padding:3px 6px;
    border-radius:4px;
    cursor:pointer;
  }
  #beatList .noteItem:hover{
    background:#e2e8f0;
  }
  #beatList .noteItem.sel{
    background:#dbeafe;
    outline:1px solid #60a5fa;
  }

  #barHL {
    position:absolute; top:0; left:0; width:0; height:0;
    pointer-events:none; z-index:1000;
    background: var(--hl-fill);
    outline: 2px solid var(--hl-stroke);
    outline-offset:-2px; border-radius: 6px;
    transition: left .12s ease, top .12s ease,
                width .12s ease, height .12s ease;
  }
  #cursor {
    position:absolute; top:0; width:2px;
    background:var(--cursor); z-index:1010;
    transform: translateX(-1px);
  }
  #hud {
    position:absolute; right:8px; top:8px;
    color:#fff; font:12px/1.35 system-ui;
    background:rgba(0,0,0,.55);
    padding:6px 8px; border-radius:6px;
  }
  object, svg {
    display:block; width:100%; height:100%;
    background:#fff !important;
  }

  .beatBox {
    position:absolute;
    background:var(--beat-fill);
    outline:1px solid var(--beat-stroke);
    outline-offset:-1px;
    border-radius:4px;
    pointer-events:auto;
    cursor:pointer;
    z-index:600;
    display:none;
  }
  .beatBox.sel {
    outline: 3px solid #ff3b30;
    background: rgba(255, 214, 10, 0.45);
  }

  /* Container background */
.dark-score body { background: #000; }

/* The SVG background itself */
.dark-score #score svg { background: #000; }

/* Force most Verovio-drawn primitives to white */
.dark-score #score svg path,
.dark-score #score svg line,
.dark-score #score svg rect,
.dark-score #score svg circle,
.dark-score #score svg ellipse,
.dark-score #score svg polygon,
.dark-score #score svg polyline,
.dark-score #score svg text {
  stroke: #fff !important;
  fill: #fff !important;
}

/* Some SVG elements are intended to be unfilled; keep that behavior */
.dark-score #score svg [fill="none"] { fill: none !important; }
.dark-score #score svg [stroke="none"] { stroke: none !important; }

/* Preserve your highlight classes (do NOT let theme override them) */
.dark-score #score svg .note-hl {
  /* whatever you use for selection highlight */
  stroke: #3aa0ff !important;
  fill: #3aa0ff !important;
}

.dark-score #score svg .midi-ok {
  stroke: #20c020 !important;
  fill: #20c020 !important;
}

/* If you have beat-box overlays/cursor overlays, also preserve them explicitly.
   Example class names shown—adjust to your actual ones. */
.dark-score #score svg .beatbox { fill: rgba(255,255,255,0.10) !important; stroke: rgba(255,255,255,0.35) !important; }
.dark-score #score svg .cursor  { stroke: #ffcc00 !important; }
</style></head>
<body>
<div id="frame">
  <div id="scorePane">
    <div id="barHL"></div>
    <div id="cursor"></div>
    <object id="page" type="image/svg+xml" data=""></object>
    <div id="hud">loading…</div>
  </div>
  <aside id="side">
    <h3>Selected beats</h3>
    <div id="beatList"></div>
  </aside>
</div>
<script>
  window.__BOOT__ = {
    ABS_INDEXES:    {ABS_INDEXES_JSON},
    NOTE_TIMES_MAP: {NOTE_TIMES_MAP_JSON},
    BEAT_TIMES_MAP: {BEAT_TIMES_MAP_JSON},
    PITCH_MAP:      {PITCH_MAP_JSON}
  };
</script>

<script type="module">
  import { createApp } from './js/app.js';

  const app = createApp(window.__BOOT__);
  window.ScoreApp = app;

  window.setBeatBoxesVisible = on      => app.setBeatBoxesVisible(on);
  window.jsSetCursorAbs      = (a,t,d) => app.jsSetCursorAbs(a,t,d);
  window.setPageAndSvg       = (p,url) => app.setPageAndSvg(p,url);

  window.onMidiNoteOn        = (pitch, velocity, ts) => app.onMidiNoteOn(pitch, velocity, ts);
  window.onMidiNoteOff       = (pitch, ts)           => app.onMidiNoteOff(pitch, ts);

  window.addEventListener('resize', () => app.handleResize());

  const DARK_STYLE_ID = "darkScoreStyle";

  function ensureDarkStyle(svgDoc, enabled) {
    if (!svgDoc) return;

    let styleEl = svgDoc.getElementById(DARK_STYLE_ID);

    if (!enabled) {
      if (styleEl) styleEl.remove();
      // also reset SVG root background if we set it
      const svgRoot = svgDoc.documentElement;
      if (svgRoot) svgRoot.style.background = "";
      return;
    }

    if (!styleEl) {
      styleEl = svgDoc.createElementNS("http://www.w3.org/2000/svg", "style");
      styleEl.setAttribute("id", DARK_STYLE_ID);
      svgDoc.documentElement.appendChild(styleEl);
    }

    // Background
    svgDoc.documentElement.style.background = "#000";

    // Force most score primitives to white; preserve highlight classes.
    styleEl.textContent = `
      svg { background: #000 !important; }

      path, line, rect, circle, ellipse, polygon, polyline, text {
        stroke: #fff !important;
        fill: #fff !important;
      }

      [fill="none"] { fill: none !important; }
      [stroke="none"] { stroke: none !important; }

      /* Preserve highlights */
      .note-hl { stroke: #3aa0ff !important; fill: #3aa0ff !important; }
      .midi-ok { stroke: #20c020 !important; fill: #20c020 !important; }
    `;
  }

  let darkEnabled = false;

  window.setDarkMode = function(enabled) {
    darkEnabled = !!enabled;

    // Apply to parent page backgrounds too
    document.body.style.background = darkEnabled ? "#000" : "#fff";
    document.getElementById("frame").style.background = darkEnabled ? "#000" : "#fff";
    document.getElementById("scorePane").style.background = darkEnabled ? "#000" : "#fff";
    const side = document.getElementById("side");
    side.style.background = darkEnabled ? "#0b0b0b" : "#fafafa";
    side.style.color = darkEnabled ? "#eee" : "#111";
    side.style.borderLeftColor = darkEnabled ? "#222" : "#e5e7eb";

    // Apply into the embedded SVG document (object)
    const obj = document.getElementById("page");
    const svgDoc = obj?.contentDocument;
    ensureDarkStyle(svgDoc, darkEnabled);
  };

  // Re-apply dark style whenever a new SVG is loaded into the <object>
  const obj = document.getElementById("page");
  obj.addEventListener("load", () => {
    ensureDarkStyle(obj.contentDocument, darkEnabled);
  });
</script>


</body></html>
