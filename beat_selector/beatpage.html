<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {
    --hl-fill: rgba(255, 214, 10, 0.18);
    --hl-stroke: rgba(255, 149, 0, 0.75);
    --cursor: #ff3b30;
    --beat-fill: rgba(255, 214, 10, 0.14);
    --beat-stroke: rgba(255, 149, 0, 0.9);
  }
  html, body {
    margin:0; padding:0; background:#fff; height:100%; color:#111;
  }
  #frame {
    position:relative;
    width:100%; height:100vh;
    overflow:hidden;
    background:#fff;
    display:flex;                /* score + sidebar */
  }
#scorePane{
  position:relative;
  flex:1 1 auto;
  height:100%;
  display:flex;
  flex-direction:column;
  min-height:0;
}

  #side{
    width:260px;
    max-width:33vw;
    border-left:1px solid #e5e7eb;
    background:#fafafa;
    overflow:auto;
    font:13px/1.3 system-ui;
  }
  #side h3{
    margin:8px 8px 4px;
    font:600 13px system-ui;
    color:#0b3a53;
  }
  #beatList .beatEntry{
    margin:6px;
    padding:6px;
    border:1px solid #dbeafe;
    background:#eff6ff;
    border-radius:6px;
  }
  #beatList .beatTitle{
    font-weight:600;
    margin-bottom:4px;
  }
  #beatList .noteItem{
    margin:3px 0;
    padding:3px 6px;
    border-radius:4px;
    cursor:default;
  }
  #beatList .noteItem:hover{
    background:#e2e8f0;
  }
  #beatList .noteItem.sel{
    background:#dbeafe;
    outline:1px solid #60a5fa;
  }

  #beatList .noteItem.midi-ok{
  background:#dcfce7;
  outline:1px solid #16a34a;
  color:#14532d;
}

.dark-score #beatList .noteItem.midi-ok {
  background: #052e16;
  outline: 1px solid #16a34a;
  color: #86efac;
}

  #barHL {
    position:absolute; top:0; left:0; width:0; height:0;
    pointer-events:none; z-index:1000;
    background: var(--hl-fill);
    outline: 2px solid var(--hl-stroke);
    outline-offset:-2px; border-radius: 6px;
    transition: left .12s ease, top .12s ease,
                width .12s ease, height .12s ease;
  }
  #cursor {
    position:absolute; top:0; width:2px;
    background:var(--cursor); z-index:1010;
    transform: translateX(-1px);
  }
  #hud {
    position:absolute; right:8px; top:8px;
    color:#fff; font:12px/1.35 system-ui;
    background:rgba(0,0,0,.55);
    padding:6px 8px; border-radius:6px;
  }

object#page{
  display:block;
  width:100%;
  flex:1 1 auto;
  min-height:0;
  background:transparent;
}

/* Keep SVG background transparent; sizing is controlled by the <object> */
svg{
  background:transparent;
}
#keyboardWrap{
  flex:0 0 140px;
  height:140px;
  border-top:1px solid #e5e7eb;
  background:#fff;
  overflow:hidden;
}

.dark-score #keyboardWrap{
  border-top:1px solid #222;
  background:#000;
}

/* Keyboard surface */
#keyboard{
  position:relative;
  height:100%;
  width:100%;
  user-select:none;
}

/* White keys */
.keyW{
  position:absolute;
  top:0; bottom:0;
  background:#fff;
  border:1px solid rgba(0,0,0,0.25);
  border-bottom:2px solid rgba(0,0,0,0.35);
  box-sizing:border-box;
}
.dark-score .keyW{
  background:#111;
  border:1px solid rgba(255,255,255,0.18);
  border-bottom:2px solid rgba(255,255,255,0.25);
}

/* Press feedback: green if correct, red if wrong */
.keyOkW{ background:#86efac !important; border-color:#16a34a !important; }
.keyOkB{ background:#16a34a !important; border-color:#14532d !important; }
.keyBadW{ background:#fecaca !important; border-color:#ef4444 !important; }
.keyBadB{ background:#ef4444 !important; border-color:#7f1d1d !important; }

/* Black keys */
.keyB{
  position:absolute;
  top:0;
  height:62%;
  background:#111;
  border:1px solid rgba(0,0,0,0.6);
  border-radius:0 0 3px 3px;
  box-sizing:border-box;
  z-index:5;
}
.dark-score .keyB{
  background:#000;
  border:1px solid rgba(255,255,255,0.25);
}

.keyDownW{ background:#86efac !important; border-color:#16a34a !important; }
.keyDownB{ background:#16a34a !important; border-color:#14532d !important; }

.keyLbl{
  position:absolute;
  left:50%;
  bottom:4px;
  transform:translateX(-50%);
  font: 10px/1 system-ui;
  color: rgba(0,0,0,0.75);
  pointer-events:none;
  white-space:nowrap;
}

.dark-score .keyLbl{
  color: rgba(255,255,255,0.75);
}

/* Labels on black keys: smaller + higher contrast */
.keyLblB{
  bottom:6px;
  font-size:9px;
  color: rgba(255,255,255,0.85);
}
.dark-score .keyLblB{
  color: rgba(255,255,255,0.85);
}

.beatBox {
  position:absolute;
  background:var(--beat-fill);
  outline:1px solid var(--beat-stroke);
  outline-offset:-1px;
  border-radius:4px;
  pointer-events:auto;
  cursor:pointer;
  z-index:600;
  display:none;
}
.beatBox.sel {
  outline: 3px solid #ff3b30;
  background: rgba(255, 214, 10, 0.45);
}

  /* Container background */
.dark-score body,
.dark-score #frame,
.dark-score #scorePane { background: #000; }

/* =========================
   DARK MODE — SIDEBAR
   ========================= */

.dark-score #side {
  background: #0b0b0b;
  color: #e5e7eb;
  border-left: 1px solid #222;
}

.dark-score #side h3 {
  color: #93c5fd;
}

.dark-score #beatList .beatEntry {
  background: #111827;
  border: 1px solid #1f2933;
}

.dark-score #beatList .beatTitle {
  color: #e5e7eb;
}

.dark-score #beatList .beatSubTitle {
  color: #9ca3af;
}

.dark-score #beatList .noteItem {
  color: #e5e7eb;
}

.dark-score #beatList .noteItem:hover {
  background: #1f2937;
}

.dark-score #beatList .noteItem.sel {
  background: #1e3a8a;
  outline: 1px solid #60a5fa;
  color: #fff;
}

</style></head>
<body>
<div id="frame">
  <div id="scorePane">
    <div id="barHL"></div>
    <div id="cursor"></div>
    <object id="page" type="image/svg+xml" data=""></object>
    <div id="hud">loading…</div>
    <div id="keyboardWrap">
      <div id="keyboard"></div>
    </div>
  </div>
  <aside id="side">
    <h3>Selected beats</h3>
    <div id="beatList"></div>
  </aside>
</div>
<script>
  window.__BOOT__ = {
    ABS_INDEXES:    {ABS_INDEXES_JSON},
    NOTE_TIMES_MAP: {NOTE_TIMES_MAP_JSON},
    BEAT_TIMES_MAP: {BEAT_TIMES_MAP_JSON},
    PITCH_MAP:      {PITCH_MAP_JSON}
  };
</script>

<script type="module">
  import { createApp } from './js/app.js';

  const app = createApp(window.__BOOT__);
  window.ScoreApp = app;

  window.setBeatBoxesVisible = on      => app.setBeatBoxesVisible(on);
  window.jsSetCursorAbs      = (a,t,d) => app.jsSetCursorAbs(a,t,d);
  window.setPageAndSvg       = (p,url) => app.setPageAndSvg(p,url);

  window.onMidiNoteOn        = (pitch, velocity, ts) => app.onMidiNoteOn(pitch, velocity, ts);
  window.onMidiNoteOff       = (pitch, ts)           => app.onMidiNoteOff(pitch, ts);

  window.addEventListener('resize', () => app.handleResize());

  const DARK_STYLE_ID = "darkScoreStyle";

  function ensureDarkStyle(svgDoc, enabled) {
    if (!svgDoc) return;

    let styleEl = svgDoc.getElementById(DARK_STYLE_ID);

    if (!enabled) {
      if (styleEl) styleEl.remove();
      // also reset SVG root background if we set it
      const svgRoot = svgDoc.documentElement;
      if (svgRoot) svgRoot.style.background = "";
      return;
    }

    if (!styleEl) {
      styleEl = svgDoc.createElementNS("http://www.w3.org/2000/svg", "style");
      styleEl.setAttribute("id", DARK_STYLE_ID);
      svgDoc.documentElement.appendChild(styleEl);
    }

    // Background
    svgDoc.documentElement.style.background = "#000";

  styleEl.textContent = `
        svg { background: #000 !important; }

        /* Paint only the rendered score layer white.
          IMPORTANT: do NOT force-fill <defs> glyphs. If glyph definitions are forced
          to a fixed color, per-note highlighting via classes cannot override them. */
        svg > g path,
        svg > g line,
        svg > g rect,
        svg > g circle,
        svg > g ellipse,
        svg > g polygon,
        svg > g polyline,
        svg > g text,
        svg > g use {
          stroke: #fff !important;
          fill: #fff !important;
        }

        svg > g [fill="none"] { fill: none !important; }
        svg > g [stroke="none"] { stroke: none !important; }
      `;
  }

  let darkEnabled = false;

 window.setDarkMode = function(enabled) {
  darkEnabled = !!enabled;

  document.documentElement.classList.toggle("dark-score", darkEnabled);

  // SVG styling (unchanged)
  const obj = document.getElementById("page");
  const svgDoc = obj?.contentDocument;
  ensureDarkStyle(svgDoc, darkEnabled);
  window.ScoreApp?.refreshMidiHighlights?.();
};


  // Re-apply dark style whenever a new SVG is loaded into the <object>
  const obj = document.getElementById("page");
  obj.addEventListener("load", () => {
    ensureDarkStyle(obj.contentDocument, darkEnabled);
  });
</script>


</body></html>
