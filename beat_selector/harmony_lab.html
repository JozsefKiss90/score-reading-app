<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Music Theory Laboratory — Concepts</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 13px/1.45 system-ui, Segoe UI, Roboto, sans-serif; color: #0f172a;
           background: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
    #labHeader { padding: 8px 12px; background: #0b3a53; color: #fff; }
    #labHeader h1 { margin: 0; font-size: 15px; }
    #labHeader .sub { font-size: 11.5px; opacity: .85; }
    #labBody { flex: 1; overflow: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; }

    .labCard { border: 1px solid #e2e8f0; border-radius: 8px; background: #fff; padding: 8px 10px; }
    .labPanelTitle { font-size: 11px; font-weight: 700; text-transform: uppercase;
                     letter-spacing: .04em; color: #0b3a53; margin-bottom: 6px; }

    /* A. Concept catalogue */
    .labConcept { margin-bottom: 6px; border: 1px solid #e2e8f0; border-radius: 6px;
                  background: #fff; overflow: hidden; }
    .labConcept.active { border-color: #2563eb; }
    .labConceptHead { padding: 6px 9px; font-weight: 600; cursor: pointer;
                      background: #eef2ff; color: #1e3a8a; }
    .labConceptHead:hover { background: #e0e7ff; }
    .labConceptHead.reserved { color: #94a3b8; cursor: default; background: #f1f5f9; }
    .labConceptDetail { padding: 2px 9px 5px; color: #64748b; font-size: 11.5px; }
    .labExpList { padding: 4px 8px 8px; }
    .labExp { padding: 6px 8px; margin: 4px 0; border: 1px solid #e5e7eb;
              border-radius: 5px; cursor: pointer; }
    .labExp:hover { background: #f1f5f9; border-color: #2563eb; }
    .labExpTitle { font-weight: 600; }
    .labExpMeta { color: #64748b; font-size: 11px; }

    /* B/C. collapsible sections */
    .labLede { font-style: italic; color: #334155; margin: 2px 0 8px; }
    .labPara { color: #334155; margin: 2px 0; }
    .labSec { margin: 4px 0; border-top: 1px solid #eef2f7; }
    .labSecHead { cursor: pointer; font-weight: 600; color: #0b3a53; padding: 4px 0; }
    .labSecHead:hover { color: #2563eb; }
    .labSecBody { padding: 2px 0 6px 2px; }
    .labBullets { margin: 2px 0; padding-left: 18px; }
    .labBullets li { margin: 2px 0; color: #334155; }
    .labChips { display: flex; flex-wrap: wrap; gap: 4px; }
    .labTermChip { padding: 1px 7px; border-radius: 999px; background: #f1f5f9;
                   border: 1px solid #e2e8f0; color: #475569; font-size: 11px; }
    .labExHeading { font-size: 14px; font-weight: 700; color: #0b3a53; }
    .labExSub { color: #64748b; font-size: 11.5px; margin-bottom: 4px; }
    .labDetailItem { margin: 4px 0; padding: 4px 6px; border-left: 3px solid #dbeafe; }
    .labDetailTitle { font-weight: 600; color: #1e3a8a; }

    /* shared rows + live guide */
    .labRow { margin: 2px 0; }
    .labLbl { color: #64748b; display: inline-block; min-width: 110px; }
    .labVal { color: #0f172a; }
    .labExpHeading { font-size: 14px; font-weight: 700; color: #0b3a53; margin-bottom: 6px; }
    .labNote { margin-top: 8px; padding: 8px; background: #eff6ff; border: 1px solid #bfdbfe;
               border-radius: 6px; color: #334155; font-style: italic; }
    .labPlaceholder { color: #94a3b8; padding: 8px 4px; }

    /* Atlas sync strip (bottom) */
    #labAtlas { padding: 6px 12px; border-top: 1px solid #e2e8f0; background: #f1f5f9;
                display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .labChip { padding: 2px 8px; border-radius: 999px; background: #dbeafe; color: #1e3a8a;
               font-size: 11px; border: 1px solid #bfdbfe; }
    #labLaunchHint { font-size: 11px; opacity: .8; }
  </style>
</head>
<body>
  <div id="labHeader">
    <h1>Music Theory Laboratory</h1>
    <div class="sub">Pick a concept and an experiment — the score plays in the middle;
      theory and the live mapping appear here and in the right-hand dashboard.
      <span id="labLaunchHint"></span></div>
  </div>
  <div id="labBody">
    <div id="labConcepts" class="labCard"></div>
    <div id="labConceptTheory" class="labCard"></div>
    <div id="labExample" class="labCard"></div>
    <div id="labExplain" class="labCard"></div>
  </div>
  <div id="labAtlas"></div>

  <script src="harmony_lab.js"></script>
  <script>
    // The host (run_harmony_lab_demo.py) injects window.LAB_DATA after load and
    // calls HarmonyLab.init(). Opened directly in a browser, show a hint.
    (function () {
      if (window.LAB_DATA && window.HarmonyLab) {
        window.HarmonyLab.init(window.LAB_DATA);
      } else {
        var c = document.getElementById("labConcepts");
        if (c) c.textContent = "Waiting for Lab data (launch via run_harmony_lab_demo.py).";
      }
    })();
  </script>
</body>
</html>
