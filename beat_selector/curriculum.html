<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Music Theory Laboratory — Curriculum</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 13px/1.45 system-ui, Segoe UI, Roboto, sans-serif; color: #0f172a;
           background: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
    #curHeader { padding: 8px 12px; background: #0b3a53; color: #fff; }
    #curHeader h1 { margin: 0; font-size: 15px; }
    #curHeader .sub { font-size: 11.5px; opacity: .85; }
    #curSearchWrap { margin-top: 6px; display: flex; gap: 6px; align-items: center; }
    #curSearch { flex: 1; padding: 4px 8px; border-radius: 6px; border: 1px solid #1e5a7a;
                 background: #0e4763; color: #fff; font-size: 12px; }
    #curSearch::placeholder { color: #9fc4d8; }
    #curLaunchHint { font-size: 11px; opacity: .8; }

    #curBody { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
    #curMain { flex: 1; display: flex; min-height: 0; }
    #curTreePane { width: 42%; min-width: 230px; overflow: auto; border-right: 1px solid #e2e8f0;
                   background: #fff; padding: 6px 4px; }
    #curDetailPane { flex: 1; overflow: auto; padding: 8px; display: flex;
                     flex-direction: column; gap: 8px; }

    /* tree */
    .curRow { display: flex; align-items: center; gap: 4px; padding: 3px 4px; border-radius: 5px;
              cursor: pointer; white-space: nowrap; }
    .curRow:hover { background: #f1f5f9; }
    .curRow.selected { background: #dbeafe; }
    .curRow.focused { outline: 2px solid #2563eb; outline-offset: -2px; }
    .curRow.reserved { color: #94a3b8; }
    .curTwisty { width: 14px; display: inline-block; text-align: center; color: #64748b; }
    .curIcon { width: 16px; display: inline-block; text-align: center; }
    .curLabel { flex: 1; overflow: hidden; text-overflow: ellipsis; }
    .curCount { font-size: 10.5px; color: #64748b; }
    .curBar { height: 4px; border-radius: 3px; background: #e2e8f0; width: 46px; overflow: hidden; }
    .curBar > span { display: block; height: 100%; background: #22c55e; }
    .curState-completed > .curIcon { color: #16a34a; }
    .curState-mastered > .curIcon { color: #7c3aed; }
    .curState-started > .curIcon { color: #d97706; }

    /* detail / pages */
    .curCard { border: 1px solid #e2e8f0; border-radius: 8px; background: #fff; padding: 8px 10px; }
    .curTitle { font-size: 15px; font-weight: 700; color: #0b3a53; }
    .curSub { color: #64748b; font-size: 11.5px; margin-bottom: 4px; }
    .curChips { display: flex; flex-wrap: wrap; gap: 4px; margin: 4px 0; }
    .curChip { padding: 1px 8px; border-radius: 999px; background: #f1f5f9; border: 1px solid #e2e8f0;
               color: #475569; font-size: 11px; }
    .curChip.atlas { background: #ede9fe; border-color: #ddd6fe; color: #5b21b6; cursor: pointer; }
    .curChip.circle { background: #fef3c7; border-color: #fde68a; color: #92400e; cursor: pointer; }
    .curChip.chord { background: #e0f2fe; border-color: #bae6fd; color: #075985; }
    .curLede { font-style: italic; color: #334155; margin: 2px 0 8px; }
    .curPara { color: #334155; margin: 4px 0; }
    .curSecTitle { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
                   color: #0b3a53; margin: 8px 0 3px; }
    .curBullets { margin: 2px 0; padding-left: 18px; }
    .curBullets li { margin: 2px 0; color: #334155; }
    .curLink { color: #2563eb; cursor: pointer; text-decoration: underline; }
    .curLaunch { margin-top: 8px; padding: 8px 14px; border: 0; border-radius: 7px; cursor: pointer;
                 background: #2563eb; color: #fff; font-weight: 600; font-size: 13px; }
    .curLaunch:hover { background: #1d4ed8; }
    .curLaunch.reserved { background: #cbd5e1; cursor: default; }
    .curRow2 { margin: 2px 0; }
    .curLbl { color: #64748b; display: inline-block; min-width: 120px; }
    .curVal { color: #0f172a; }
    .curNote { margin-top: 6px; padding: 8px; background: #eff6ff; border: 1px solid #bfdbfe;
               border-radius: 6px; color: #334155; font-style: italic; }
    .curPlaceholder { color: #94a3b8; padding: 8px 4px; }
    .curProgressBar { height: 8px; border-radius: 4px; background: #e2e8f0; overflow: hidden; margin: 4px 0; }
    .curProgressBar > span { display: block; height: 100%; background: #22c55e; }

    /* bottom sync strip */
    #curAtlas { padding: 6px 12px; border-top: 1px solid #e2e8f0; background: #f1f5f9;
                display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .curSyncChip { padding: 2px 8px; border-radius: 999px; background: #dbeafe; color: #1e3a8a;
                   font-size: 11px; border: 1px solid #bfdbfe; }
  </style>
</head>
<body>
  <div id="curHeader">
    <h1>Music Theory Laboratory</h1>
    <div class="sub">The canonical curriculum — browse a lesson, open an exercise, launch it in the trainer.</div>
    <div id="curSearchWrap">
      <input id="curSearch" type="text" placeholder="Search: ii V I, predominant, C major, authentic cadence…" />
      <span id="curLaunchHint"></span>
    </div>
  </div>
  <div id="curBody">
    <div id="curMain">
      <div id="curTreePane"><div id="curTree" tabindex="0"></div></div>
      <div id="curDetailPane">
        <div id="curDetail" class="curCard"></div>
        <div id="curLive" class="curCard"></div>
        <div id="curProgress" class="curCard"></div>
      </div>
    </div>
  </div>
  <div id="curAtlas"></div>

  <script src="curriculum.js"></script>
  <script>
    (function () {
      if (window.CURRICULUM && window.Curriculum) {
        window.Curriculum.init(window.CURRICULUM);
      } else {
        var t = document.getElementById("curTree");
        if (t) t.textContent = "Waiting for curriculum data (launch via run_harmony_lab_demo.py).";
      }
    })();
  </script>
</body>
</html>
